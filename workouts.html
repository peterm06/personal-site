<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fitness — Peter Miller</title>
    <meta
      name="description"
      content="A running tally of my workouts across CorePower and Orangetheory, as a calendar."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Atkinson+Hyperlegible:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0f1218;
        --paper: #e9ebee;
        --muted: #8f98a3;
        --hairline: #232a34;
        --jade: #4cc8a3;
        --sky: #5aa8e8;
        --indigo: #7b83ea;
        --violet: #a982e3;
        --sheen-edge: var(--paper);

        /* calendar: one flat accent per era */
        --empty: #1b212b;
        --otf: #45b892;
        --cp: #9a7be0;
      }

      [data-theme='light'] {
        --ink: #f2f3f5;
        --paper: #1a2028;
        --muted: #5c6672;
        --hairline: #d6dae0;
        --jade: #1f9a78;
        --sky: #2f7fc4;
        --indigo: #5560cf;
        --violet: #7e58c4;
        --sheen-edge: #1a2028;

        --empty: #e2e5e9;
        --otf: #2a9a76;
        --cp: #7e58c4;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        height: 100%;
      }

      body {
        min-height: 100%;
        display: grid;
        justify-items: center;
        align-content: start;
        background: var(--ink);
        color: var(--paper);
        font-family: 'Atkinson Hyperlegible', system-ui, sans-serif;
        font-size: 1.0625rem;
        line-height: 1.6;
        padding: clamp(3rem, 10vh, 6rem) 1.5rem 4rem;
        transition:
          background 240ms ease,
          color 240ms ease;
      }

      main {
        width: 100%;
        max-width: 60rem;
      }

      .eyebrow {
        color: var(--muted);
        font-size: 0.875rem;
        letter-spacing: 0.02em;
      }

      .eyebrow a {
        color: var(--muted);
        text-decoration: none;
        border-bottom: 1px solid var(--hairline);
      }

      .eyebrow a:hover,
      .eyebrow a:focus-visible {
        color: var(--paper);
      }

      h1 {
        font-family: 'Fraunces', serif;
        font-weight: 600;
        font-size: clamp(2.2rem, 7vw, 3rem);
        letter-spacing: -0.015em;
        line-height: 1.2;
        padding-bottom: 0.12em; /* room for descenders under background-clip: text */
        margin-top: 0.4rem;
        background: linear-gradient(
          100deg,
          var(--sheen-edge) 0%,
          var(--jade) 28%,
          var(--sky) 44%,
          var(--indigo) 60%,
          var(--violet) 76%,
          var(--sheen-edge) 100%
        );
        background-size: 220% 100%;
        background-position: 0% 0;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: sheen 14s ease-in-out infinite alternate;
      }

      @keyframes sheen {
        from { background-position: 0% 0; }
        to { background-position: 100% 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        h1 { animation: none; background-position: 50% 0; }
      }

      .lede {
        margin-top: 0.75rem;
        color: var(--muted);
        max-width: 42rem;
      }

      /* --- summary card --- */
      .summary-card {
        margin-top: 2.25rem;
        border: 1px solid var(--hairline);
        border-radius: 14px;
        padding: 1.5rem 1.75rem;
        display: grid;
        gap: 1.25rem;
      }
      .summary-primary {
        display: flex;
        flex-wrap: wrap;
        gap: 2.5rem;
        align-items: baseline;
      }
      .stat .num {
        font-family: 'Fraunces', serif;
        font-weight: 600;
        font-size: 2.2rem;
        line-height: 1;
      }
      .stat .lbl {
        color: var(--muted);
        font-size: 0.8rem;
        margin-top: 0.25rem;
      }
      .summary-primary .stat:first-child .num {
        font-size: 2.8rem;
      }
      .num .dot {
        display: inline-block;
        width: 16px;
        height: 16px;
        border-radius: 4px;
        margin-right: 0.5rem;
        vertical-align: 0.06em;
      }

      /* --- the calendar hero --- */
      .hero {
        margin-top: 2rem;
      }
      .heatmap-wrap {
        max-width: 54rem;
      }
      svg.heatmap {
        display: block;
        width: 100%;
        height: auto;
      }
      .heatmap .mlabel {
        font-family: 'Atkinson Hyperlegible', sans-serif;
        font-size: 9px;
        fill: var(--muted);
      }
      .heatmap .ylabel {
        font-family: 'Fraunces', serif;
        font-weight: 600;
        font-size: 17px;
        fill: var(--muted);
      }
      .heatmap .cell {
        stroke: rgba(0, 0, 0, 0.18);
        stroke-width: 0.5;
      }
      [data-theme='light'] .heatmap .cell {
        stroke: rgba(0, 0, 0, 0.06);
      }

      /* --- theme toggle (same as index) --- */
      #theme-toggle {
        position: fixed;
        top: 1.25rem;
        right: 1.25rem;
        width: 2.5rem;
        height: 2.5rem;
        display: grid;
        place-items: center;
        background: transparent;
        border: 1px solid var(--hairline);
        border-radius: 50%;
        color: var(--muted);
        cursor: pointer;
        transition:
          color 160ms ease,
          border-color 160ms ease;
      }
      #theme-toggle:hover,
      #theme-toggle:focus-visible {
        color: var(--paper);
        border-color: var(--muted);
      }
      #theme-toggle:focus-visible {
        outline: 2px solid var(--indigo);
        outline-offset: 3px;
      }
      #theme-toggle svg { width: 1.125rem; height: 1.125rem; }
      #theme-toggle .sun { display: none; }
      #theme-toggle .moon { display: block; }
      [data-theme='light'] #theme-toggle .sun { display: block; }
      [data-theme='light'] #theme-toggle .moon { display: none; }
    </style>
  </head>

    <script>
      ;(function () {
        var root = document.documentElement
        var btn = document.getElementById('theme-toggle')
        function stored() { try { return localStorage.getItem('theme') } catch (e) { return null } }
        function store(theme) { try { localStorage.setItem('theme', theme) } catch (e) {} }
        function apply(theme) {
          if (theme === 'light') {
            root.setAttribute('data-theme', 'light')
            btn.setAttribute('aria-label', 'Switch to dark mode')
          } else {
            root.removeAttribute('data-theme')
            btn.setAttribute('aria-label', 'Switch to light mode')
          }
        }
        var initial = stored()
        if (!initial) {
          initial = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        apply(initial)
        btn.addEventListener('click', function () {
          var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light'
          apply(next)
          store(next)
        })
      })()
    </script>
