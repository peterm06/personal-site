{% extends "base.html" %}
{% block title %}{{ page.title }} · {{ config.title }}{% endblock title %}

{% block content %}
<article class="page">
  <h1 style="view-transition-name: post-{{ page.slug }}">{{ page.title }}</h1>
  {% if page.date %}
  <p class="post-meta">
    <time datetime="{{ page.date }}">{{ page.date | date(format="%B %-d, %Y") }}</time>
  </p>
  {% endif %}
  <div class="prose">
    {{ page.content | safe }}
  </div>
</article>
{% endblock content %}
