name: Check generated pages

# workouts/index.html and reading/index.html are built from data/ by the
# scripts in scripts/. Fail if a PR changes the data or a generator without
# committing the regenerated page.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/gen_workouts.py
      - run: python3 scripts/gen_reading.py
      - name: Fail if a generated page is out of date
        run: |
          if ! git diff --quiet -- workouts/index.html reading/index.html; then
            git diff --stat -- workouts/index.html reading/index.html
            echo '::error::Generated pages are out of date. Run python3 scripts/gen_workouts.py and python3 scripts/gen_reading.py, then commit the result.'
            exit 1
          fi
